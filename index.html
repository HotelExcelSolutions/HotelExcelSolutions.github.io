<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Excel Solutions | Automated Hotel Accounting</title>

<style>
:root {
  --primary: #0f2b48;
  --accent: #1bb59b;
  --accent-hover: #15937d;
  --light-bg: #f4f7f9;
  --text-dark: #2c3e50;
  --text-muted: #666666;
  --white: #ffffff;
  --banner-bg: #e8f3f7;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  color: var(--text-dark);
  background-color: var(--light-bg);
  line-height: 1.6;
}

/* NAVBAR */
header {
  background: var(--primary);
  padding: 1rem 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

header img {
  height: 100px;
}

nav a {
  color: var(--white);
  text-decoration: none;
  margin: 0 15px;
  font-size: 0.95rem;
  transition: color 0.2s;
}

nav a:hover {
  color: var(--accent);
}

.btn-quote {
  background: var(--accent);
  color: var(--white);
  padding: 8px 18px;
  border-radius: 4px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.btn-quote:hover {
  background: var(--accent-hover);
}

/* HERO */
.hero {
  background: var(--white);
  padding: 4rem 5%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
}

.hero-text {
  flex: 1;
  min-width: 300px;
}

.hero-text h1 {
  font-size: 2.5rem;
  color: var(--primary);
  line-height: 1.2;
  margin-bottom: 1rem;
}

.hero-text p {
  font-size: 1.1rem;
  color: var(--text-muted);
  margin-bottom: 1.5rem;
}

.hero-image {
  flex: 1;
  min-width: 300px;
  text-align: center;
}

.hero-image img {
  width: 100%;
  max-width: 500px;
  border-radius: 8px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* MAIN GRID */
.container {
  padding: 3rem 5%;
  max-width: 1200px;
  margin: 0 auto;
}

.layout-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 2rem;
}

@media (max-width: 850px) {
  .layout-grid {
    grid-template-columns: 1fr;
  }
}

/* SERVICES */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
}

.card {
  background: var(--white);
  border-radius: 8px;
  padding: 1.5rem;
  text-align: center;
  border: 1px solid #e1e8ed;
  box-shadow: 0 4px 6px rgba(0,0,0,0.03);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card-icon {
  font-size: 2.5rem;
  margin-bottom: 0.5rem;
}

.card h3 {
  font-size: 1.1rem;
  color: var(--primary);
  margin-bottom: 0.5rem;
}

.card p {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
}

.price {
  font-weight: bold;
  color: var(--primary);
  font-size: 0.85rem;
  margin-bottom: 1rem;
  display: block;
}

.btn-card {
  background: var(--primary);
  color: var(--white);
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
  font-size: 0.85rem;
}

.btn-card:hover {
  background: var(--accent);
}

/* ADVANTAGE */
.advantage-box {
  background: var(--white);
  padding: 1.5rem;
  border-radius: 8px;
  border: 1px solid #e1e8ed;
}

.advantage-box h2 {
  color: var(--primary);
  font-size: 1.3rem;
  margin-bottom: 1rem;
}

.feature-item {
  display: flex;
  gap: 12px;
  margin-bottom: 1.2rem;
}

.feature-item strong {
  display: block;
  color: var(--primary);
  font-size: 0.95rem;
}

.feature-item p {
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* STEPS */
.steps-box {
  background: var(--accent);
  color: var(--white);
  padding: 1.5rem;
  border-radius: 8px;
  margin-top: 1.5rem;
}

.steps-box h3 {
  margin-bottom: 1rem;
  font-size: 1.2rem;
}

.steps-list {
  display: flex;
  justify-content: space-between;
  text-align: center;
  margin-bottom: 1rem;
}

.step {
  flex: 1;
}

.step-num {
  background: rgba(255,255,255,0.2);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 5px auto;
  font-weight: bold;
}

.step p {
  font-size: 0.75rem;
}

/* NEW READABLE BANNER */
.guarantee-banner {
  background: var(--banner-bg);
  color: var(--primary);
  padding: 1.5rem;
  border-radius: 8px;
  margin-top: 2rem;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}

.guarantee-banner p {
  font-size: 0.9rem;
  line-height: 1.5;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.modal-content {
  background: var(--white);
  padding: 2rem;
  border-radius: 8px;
  width: 90%;
  max-width: 450px;
  position: relative;
}

.close
