<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Excel Solutions | Automated Hotel Accounting</title>

<style>
:root {
  --primary: #0f2b48;
  --accent: #1bb59b;
  --accent-hover: #15937d;
  --light-bg: #f4f7f9;
  --text-dark: #2c3e50;
  --text-muted: #666666;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  color: var(--text-dark);
  background-color: var(--light-bg);
  line-height: 1.6;
}

/* NAVBAR */
header {
  background: var(--primary);
  padding: 1rem 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

header img {
  height: 100px;
}

nav a {
  color: var(--white);
  text-decoration: none;
  margin: 0 15px;
  font-size: 0.95rem;
  transition: color 0.2s;
}

nav a:hover {
  color: var(--accent);
}

.btn-quote {
  background: var(--accent);
  color: var(--white);
  padding: 8px 18px;
  border-radius: 4px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
}

.btn-quote:hover {
  background: var(--accent-hover);
}

/* HERO */
.hero {
  background: var(--white);
  padding: 4rem 5%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
}

.hero-text {
  flex: 1;
  min-width: 300px;
}

.hero-text h1 {
  font-size: 2.5rem;
  color: var(--primary);
  line-height: 1.2;
  margin-bottom: 1rem;
}

.hero-text p {
  font-size: 1.1rem;
  color: var(--text-muted);
  margin-bottom: 1.5rem;
}

.hero-image {
  flex: 1;
  min-width: 300px;
  text-align: center;
}

.hero-image img {
  width: 100%;
  max-width: 500px;
  border-radius: 8px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* MAIN GRID */
.container {
  padding: 3rem 5%;
  max-width: 1200px;
  margin: 0 auto;
}

.layout-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 2rem;
}
